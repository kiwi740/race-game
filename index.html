<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Rush</title>
  <style>
    :root {
      --bg1: #050816;
      --bg2: #111827;
      --road: #141b2d;
      --road-edge: #0f172a;
      --lane: rgba(255,255,255,0.3);
      --hud: #e2e8f0;
      --panel: rgba(15,23,42,0.68);
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg2) 32%, var(--bg1) 100%);
      color: var(--hud);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      width: min(92vw, 500px);
      position: relative;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .left-group,.right-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel {
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 7px 10px;
      backdrop-filter: blur(6px);
    }

    .boost-bar {
      width: 120px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .boost-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22d3ee, #a78bfa, #fbbf24);
      border-radius: inherit;
      box-shadow: 0 0 18px rgba(34,211,238,0.8);
      transition: width 0.08s linear;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;
      border: 3px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, #070d1e 0%, #040910 100%);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 25;
      background: rgba(2,6,23,0.38);
      border-radius: 22px;
      backdrop-filter: blur(2px);
    }

    .overlay.hidden {
      display: none;
    }

    .menu {
      width: min(80%, 330px);
      background: rgba(15,23,42,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 24px 18px 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .title {
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1;
      margin: 0 0 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, #7dd3fc, #a78bfa, #f9a8d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
    }

    .subtitle {
      color: #cbd5e1;
      margin: 10px 0 18px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(135deg, #67e8f9, #c084fc);
      box-shadow: 0 12px 24px rgba(103, 232, 249, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(192,132,252,0.28);
    }

    .controls {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 14px;
      line-height: 1.6;
    }

    .controls strong {
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="left-group">
        <div class="panel">Score: <span id="score">0</span></div>
        <div class="panel">Best: <span id="best">0</span></div>
      </div>
      <div class="right-group">
        <div class="panel">Lives: <span id="lives">3</span></div>
        <div class="panel">
          <div class="boost-bar"><div id="boostFill" class="boost-fill"></div></div>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas" width="500" height="760"></canvas>

    <div id="overlay" class="overlay">
      <div class="menu">
        <h1 class="title">Neon Rush</h1>
        <div class="subtitle">Snelheid. Nitro. Overleven.</div>
        <div class="button-row">
          <button id="startBtn">Start Race</button>
        </div>
        <div class="controls">
          <div><strong>Move:</strong> ← → / A D</div>
          <div><strong>Nitro:</strong> Space</div>
          <div><strong>Restart:</strong> R</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const livesEl = document.getElementById('lives');
    const boostFillEl = document.getElementById('boostFill');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    const road = {
      x: 110,
      y: 0,
      width: 280,
      height: canvas.height,
      laneCount: 3,
      laneWidth: 280 / 3
    };

    const skyColors = [
      ['#050816', '#111827'],
      ['#0b132b', '#1d3557'],
      ['#12071a', '#2a0b2e'],
      ['#050d20', '#0d4d59']
    ];

    const game = {
      started: false,
      over: false,
      score: 0,
      best: Number(localStorage.getItem('neonRushBest') || 0),
      lives: 3,
      speed: 6,
      difficulty: 1,
      spawnTimer: 0,
      coinTimer: 0,
      boost: 100,
      boostActive: false,
      roadScroll: 0,
      stars: [],
      cars: [],
      coins: [],
      lastTime: 0,
      flashTimer: 0
    };

    const player = {
      lane: 1,
      x: 0,
      y: canvas.height - 130,
      w: 54,
      h: 88,
      color: '#7dd3fc',
      boostGlow: 0
    };

    function setupStars() {
      game.stars = Array.from({ length: 70 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        s: Math.random() * 0.8 + 0.5
      }));
    }

    function laneX(lane) {
      return road.x + road.laneWidth * lane + road.laneWidth / 2;
    }

    function resetGame() {
      game.score = 0;
      game.lives = 3;
      game.speed = 6;
      game.difficulty = 1;
      game.spawnTimer = 700;
      game.coinTimer = 1300;
      game.boost = 100;
      game.boostActive = false;
      game.roadScroll = 0;
      game.flashTimer = 0;
      game.cars = [];
      game.coins = [];
      player.lane = 1;
      player.x = laneX(1);
      updateHud();
    }

    function startGame() {
      if (game.over) {
        resetGame();
      }
      game.started = true;
      game.over = false;
      overlay.classList.add('hidden');
      game.lastTime = 0;
    }

    function endGame() {
      game.started = false;
      game.over = true;
      if (game.score > game.best) {
        game.best = Math.floor(game.score);
        localStorage.setItem('neonRushBest', String(game.best));
      }
      overlay.classList.remove('hidden');
      overlay.querySelector('.subtitle').textContent = `Game over • Score: ${Math.floor(game.score)} • Best: ${game.best}`;
      overlay.querySelector('.title').textContent = 'Neon Rush';
      overlay.querySelector('#startBtn').textContent = 'Play Again';
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(game.score);
      bestEl.textContent = game.best;
      livesEl.textContent = game.lives;
      boostFillEl.style.width = `${game.boost}%`;
    }

    function spawnCar() {
      const lanes = [0, 1, 2];
      const colorPool = ['#f87171', '#fbbf24', '#34d399', '#a78bfa', '#fb7185', '#22d3ee'];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      const w = 52 + Math.random() * 12;
      const h = 82 + Math.random() * 22;
      const y = -120;
      game.cars.push({
        lane,
        x: laneX(lane),
        y,
        w,
        h,
        color: colorPool[Math.floor(Math.random() * colorPool.length)],
        speed: (Math.random() * 2.2 + 4.2 + game.difficulty * 0.8) * (game.speed / 6)
      });
    }

    function spawnCoin() {
      const lane = Math.floor(Math.random() * 3);
      game.coins.push({
        lane,
        x: laneX(lane),
        y: -30,
        r: 12,
        spin: Math.random() * Math.PI * 2,
        speed: 4 + game.speed * 0.5
      });
    }

    function movePlayer(dir) {
      if (!game.started || game.over) return;
      player.lane += dir;
      if (player.lane < 0) player.lane = 0;
      if (player.lane > 2) player.lane = 2;
      player.x = laneX(player.lane);
    }

    function useBoost() {
      if (!game.started || game.over) return;
      if (game.boost > 0) {
        game.boostActive = true;
        game.boost -= 26;
      } else {
        game.boostActive = false;
      }
    }

    function update(dt) {
      if (!game.started || game.over) return;

      game.difficulty += 0.0008 * dt;
      game.speed += 0.003 * dt;
      game.roadScroll += (game.speed * dt * 0.8);

      if (game.boostActive) {
        game.speed += 0.05 * dt;
        game.boost -= 0.7 * dt;
        if (game.boost <= 0) {
          game.boost = 0;
          game.boostActive = false;
        }
      } else {
        game.boost = Math.min(100, game.boost + 0.12 * dt);
      }

      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        spawnCar();
        game.spawnTimer = Math.max(500, 1200 - game.difficulty * 45);
      }

      game.coinTimer -= dt;
      if (game.coinTimer <= 0) {
        spawnCoin();
        game.coinTimer = Math.max(800, 1700 - game.difficulty * 25);
      }

      for (let i = game.cars.length - 1; i >= 0; i--) {
        const car = game.cars[i];
        car.y += (game.speed + car.speed) * (dt / 16.67);

        const pX = laneX(player.lane);
        const hitBoxP = { x: pX - player.w / 2, y: player.y, w: player.w, h: player.h };
        const hitBoxC = { x: laneX(car.lane) - car.w / 2, y: car.y, w: car.w, h: car.h };

        if (rectsOverlap(hitBoxP, hitBoxC)) {
          game.cars.splice(i, 1);
          game.flashTimer = 18;
          game.lives -= 1;
          if (game.lives <= 0) {
            endGame();
            return;
          }
          continue;
        }

        if (car.y > canvas.height + 140) {
          game.cars.splice(i, 1);
        }
      }

      for (let i = game.coins.length - 1; i >= 0; i--) {
        const coin = game.coins[i];
        coin.y += (game.speed + coin.speed) * (dt / 16.67);
        coin.spin += 0.18 * dt;

        const dx = Math.abs(coin.x - player.x);
        const dy = Math.abs(coin.y - player.y);
        if (dx < 34 && dy < 48) {
          game.coins.splice(i, 1);
          game.score += 25;
          continue;
        }

        if (coin.y > canvas.height + 40) {
          game.coins.splice(i, 1);
        }
      }

      game.score += dt * 0.025 + (game.boostActive ? 0.06 : 0);
      updateHud();
    }

    function rectsOverlap(a, b) {
      return !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);
    }

    function drawBackground() {
      const palette = skyColors[Math.floor((game.score / 250) % skyColors.length)];
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, palette[0]);
      sky.addColorStop(1, palette[1]);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of game.stars) {
        const alpha = 0.4 + star.s * 0.6;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, (star.y + game.roadScroll * 0.15) % canvas.height, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(18, 24, 39, 0.6)';
      ctx.fillRect(0, canvas.height * 0.62, canvas.width, canvas.height * 0.38);
    }

    function drawRoad() {
      const roadTop = canvas.height * 0.08;
      const horizon = canvas.height * 0.66;
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, roadTop, canvas.width, canvas.height - roadTop);

      ctx.fillStyle = '#141b2d';
      ctx.fillRect(road.x, 0, road.width, canvas.height);

      ctx.fillStyle = '#0d1320';
      ctx.fillRect(road.x - 22, 0, 22, canvas.height);
      ctx.fillRect(road.x + road.width, 0, 22, canvas.height);

      for (let i = 0; i < 16; i++) {
        const offset = ((game.roadScroll * 1.7 + i * 80) % (canvas.height + 120)) - 60;
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(road.x + road.laneWidth - 4, offset, 6, 42);
        ctx.fillRect(road.x + road.laneWidth * 2 - 4, offset, 6, 42);
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(road.x, horizon);
      ctx.lineTo(road.x + road.width, horizon);
      ctx.stroke();

      for (let i = 0; i < 5; i++) {
        const y = (i * 120 + (game.roadScroll * 0.5) % 120) - 80;
        ctx.fillStyle = 'rgba(125, 211, 252, 0.12)';
        ctx.fillRect(road.x + 10, y, road.width - 20, 50);
      }
    }

    function drawCar(x, y, w, h, color, glowing = false) {
      ctx.save();
      ctx.translate(x, y);
      if (glowing) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = color;
      }

      ctx.fillStyle = color;
      ctx.fillRect(-w / 2, 0, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillRect(-w * 0.3, h * 0.18, w * 0.6, h * 0.3);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.fillRect(-w * 0.2, h * 0.25, w * 0.4, h * 0.16);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-w * 0.38, 10, 12, 22);
      ctx.fillRect(w * 0.26, 10, 12, 22);
      ctx.fillRect(-w * 0.38, h - 30, 12, 22);
      ctx.fillRect(w * 0.26, h - 30, 12, 22);

      if (glowing) {
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(-w * 0.18, -6, w * 0.36, 12);
      }

      ctx.restore();
    }

    function drawCoin(coin) {
      ctx.save();
      ctx.translate(coin.x, coin.y);
      ctx.rotate(coin.spin);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, coin.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fef3c7';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(-3, -8, 6, 16);
      ctx.restore();
    }

    function drawBoostTrail() {
      if (!game.boostActive || !game.started || game.over) return;
      ctx.fillStyle = 'rgba(34, 211, 238, 0.36)';
      ctx.beginPath();
      ctx.moveTo(player.x - 12, player.y + player.h / 2 + 10);
      ctx.lineTo(player.x - 18, player.y + player.h / 2 + 40);
      ctx.lineTo(player.x + 18, player.y + player.h / 2 + 40);
      ctx.lineTo(player.x + 12, player.y + player.h / 2 + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(168, 85, 247, 0.46)';
      ctx.fillRect(player.x - 18, player.y + player.h / 2 + 12, 36, 14);
    }

    function drawFlash() {
      if (game.flashTimer <= 0) return;
      ctx.fillStyle = `rgba(248,113,113,${Math.min(0.55, game.flashTimer / 18)})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      game.flashTimer -= 1;
    }

    function render() {
      drawBackground();
      drawRoad();

      for (const coin of game.coins) drawCoin(coin);
      for (const car of game.cars) drawCar(car.x, car.y, car.w, car.h, car.color, false);
      drawBoostTrail();
      drawCar(player.x, player.y, player.w, player.h, player.color, true);
      drawFlash();
    }

    function loop(ts) {
      if (!game.lastTime) game.lastTime = ts;
      const dt = Math.min(32, ts - game.lastTime);
      game.lastTime = ts;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') { movePlayer(-1); }
      if (key === 'arrowright' || key === 'd') { movePlayer(1); }
      if (key === ' ' || e.code === 'Space') {
        e.preventDefault();
        useBoost();
      }
      if (key === 'r') {
        resetGame();
        startGame();
      }
    });

    document.addEventListener('keyup', () => {
      game.boostActive = false;
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      startGame();
    });

    setupStars();
    resetGame();
    updateHud();
    overlay.querySelector('.subtitle').textContent = 'Snelheid. Nitro. Overleven.';
    overlay.querySelector('#startBtn').textContent = 'Start Race';
    requestAnimationFrame(loop);
  </script>
</body>
</html>
